name: Deploy demo site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "relaxdiff/**"
      - "examples/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      use_llm:
        description: "Use DeepSeek to (re)generate narratives (requires DEEPSEEK_API_KEY secret)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Rebuild demo reports
        env:
          # Only present when workflow_dispatch is triggered with use_llm=true
          # AND the secret has been configured in repo settings.
          DEEPSEEK_API_KEY: ${{ inputs.use_llm && secrets.DEEPSEEK_API_KEY || '' }}
        run: |
          python examples/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
