<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80" role="img" aria-label="RelaxDiff">
  <!-- Before: regular 2x2 lattice (black) -->
  <g stroke="#1f2328" stroke-width="2.2" fill="none">
    <rect x="8" y="20" width="40" height="40"/>
  </g>
  <g fill="#1f2328">
    <circle cx="8"  cy="20" r="4"/>
    <circle cx="48" cy="20" r="4"/>
    <circle cx="8"  cy="60" r="4"/>
    <circle cx="48" cy="60" r="4"/>
  </g>

  <!-- Delta -->
  <text x="60" y="48" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
        font-size="26" font-weight="700" fill="#0969da">Δ</text>

  <!-- After: distorted lattice (blue), atoms shifted to convey "diff" -->
  <g stroke="#0969da" stroke-width="2.2" fill="none">
    <path d="M 96 16 L 140 24 L 144 62 L 92 56 Z"/>
  </g>
  <g fill="#0969da">
    <circle cx="96"  cy="16" r="4"/>
    <circle cx="140" cy="24" r="4"/>
    <circle cx="92"  cy="56" r="4"/>
    <circle cx="144" cy="62" r="4"/>
  </g>

  <!-- Wordmark -->
  <text x="166" y="52" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
        font-size="32" font-weight="700" fill="#1f2328" letter-spacing="-0.6">
    Relax<tspan fill="#0969da">Diff</tspan>
  </text>
</svg>
